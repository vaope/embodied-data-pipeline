# UR5e arm-only robot profile. Engineering choices: ADR-0019.
#
# Source: pinned Google DeepMind MuJoCo Menagerie model, see
# assets/mjcf/universal_robots_ur5e/SOURCES.md.
# This model has no gripper. The zero width limits and explicit unsupported
# command mode prevent the Franka jaw profile from being implied here.

robot_binding:
  robot_id: ur5e

  mjcf_uri: assets/mjcf/universal_robots_ur5e/ur5e.xml
  mjcf_source: google-deepmind/mujoco_menagerie/universal_robots_ur5e/ur5e.xml@c96a32d28fb5da84da38c1da4d749e7a13212855
  mjcf_license: BSD-3-Clause

  dof: 6
  gripper_dof: 0
  eef_body_name: wrist_3_link
  base_body_name: base
  joint_names:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  gripper_joint_names: []
  max_reach_m: 0.85

  gripper_width_min_m: 0.0
  gripper_width_max_m: 0.0
  gripper_command_mode: unsupported_no_gripper
  require_base_from_episode: true

  ik:
    solver: mink
    qp_backend: quadprog
    iterations: 100
    tolerance: 1.0e-5
    warm_start: true
    seed_attempts: 12
    max_joint_jump_rad: 1.5
