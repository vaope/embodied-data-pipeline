name: Validate CPU pipeline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install isolated pipeline package
        run: python -m pip install './packages/pipeline[annotation,io,dev]'
      - name: Run existing CPU checks
        working-directory: packages/pipeline
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Run synthetic retrieval demo
        run: edp-demo --out '${{ runner.temp }}/edp-demo'
      - name: Build content preview without external media
        run: python website/build_showcase.py --out '${{ runner.temp }}/site-preview'
